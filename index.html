<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 명함 - 체사레</title>
  <style>
    :root{
      --bg1:#0ea5e9;
      --bg2:#8b5cf6;
      --card:#0b1220cc;
      --card2:#0b1220f2;
      --text:#e5e7eb;
      --muted:#a1a1aa;
      --accent:#22c55e;
      --stroke:rgba(255,255,255,.14);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, "Apple SD Gothic Neo", sans-serif;
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(34,197,94,.35), transparent 55%),
        radial-gradient(900px 700px at 90% 20%, rgba(99,102,241,.35), transparent 50%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      padding:24px;
      overflow-x:hidden;
    }

    .wrap{
      width:min(980px, 100%);
      display:grid;
      grid-template-columns: 1fr;
      gap:16px;
      align-items:start;
    }

    .card{
      position:relative;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, var(--card), var(--card2));
      border-radius:24px;
      padding:22px;
      box-shadow:
        0 24px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(600px 220px at 20% 0%, rgba(255,255,255,.12), transparent 55%),
        radial-gradient(500px 240px at 80% 10%, rgba(34,197,94,.18), transparent 55%);
      pointer-events:none;
      filter: blur(0px);
    }

    .top{
      position:relative;
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:stretch;
    }

    .identity{
      width:100%;
      padding-top:6px;
    }

    .name{
      font-size:34px;
      line-height:1.05;
      margin:0;
      letter-spacing:-0.02em;
      text-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .job{
      margin:8px 0 0;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
      display:flex;
      gap:10px;
      align-items:center;
    }
    .job .dot{
      width:10px; height:10px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #bbf7d0, var(--accent));
      box-shadow:0 0 0 6px rgba(34,197,94,.12);
      flex:0 0 auto;
    }

    .intro{
      margin:14px 0 0;
      font-size:16px;
      color:rgba(229,231,235,.92);
      max-width: 52ch;
    }

    .grid{
      position:relative;
      margin-top:18px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    .pill{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      border-radius:16px;
      padding:12px 12px;
      display:flex;
      gap:10px;
      align-items:center;
      text-decoration:none;
      color:inherit;
      width:100%;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .pill:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.22);
    }

    /* YOUTUBE 빨간색 버튼 */
    .pill--youtube{
      border-color: rgba(239,68,68,.45);
      background: rgba(239,68,68,.16);
    }
    .pill--youtube .icon{
      background: rgba(239,68,68,.14);
      border-color: rgba(239,68,68,.25);
    }
    .pill--youtube:hover{
      background: linear-gradient(135deg, rgba(239,68,68,.95), rgba(249,115,22,.92));
      border-color: rgba(255,255,255,.30);
      transform: translateY(-2px);
    }

    .icon{
      width:38px; height:38px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      flex:0 0 auto;
    }
    .pill b{
      display:block;
      font-size:13px;
      color:var(--muted);
      font-weight:600;
      letter-spacing:.02em;
    }
    .pill span{
      display:block;
      margin-top:2px;
      font-size:14px;
      font-weight:650;
      color:rgba(229,231,235,.97);
      word-break:break-word;
    }

    .aside{
      width: 100%;
      flex:0 0 auto;
      display:flex;
      justify-content:center;
      order:-1; /* 캐릭터를 카드 맨 위로 배치 */
    }

    .avatar{
      width:100%;
      max-width:320px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      padding:14px;
      position:relative;
      overflow:hidden;
    }
    .avatar::after{
      content:"";
      position:absolute;
      inset:-40%;
      background:
        radial-gradient(circle at 30% 20%, rgba(34,197,94,.25), transparent 50%),
        radial-gradient(circle at 80% 30%, rgba(139,92,246,.25), transparent 55%);
      transform: rotate(14deg);
      pointer-events:none;
    }

    .floaty{
      animation: floaty 4.6s ease-in-out infinite;
      transform-origin:center;
      position:relative;
      z-index:1;
    }
    @keyframes floaty{
      0%,100%{ transform: translateY(0px); }
      50%{ transform: translateY(-8px); }
    }

    .hintRow{
      position:relative;
      margin-top:14px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      z-index:1;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color:rgba(229,231,235,.96);
      border-radius:14px;
      padding:10px 12px;
      cursor:pointer;
      font-weight:650;
      letter-spacing:.01em;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .btn:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.24);
    }

    .small{
      color:rgba(229,231,235,.70);
      font-size:12.5px;
      line-height:1.4;
    }

    @media (max-width: 740px){
      .grid{ grid-template-columns: 1fr; }
      .top{ gap:12px; }
      .aside{ justify-content:center; }
      .name{ font-size:30px; }
    }

    /* SVG 눈 깜빡임 */
    .blink { transform-origin: center; }
    .blink.anim { animation: blink 5.2s ease-in-out infinite; }
    @keyframes blink{
      0%, 46%, 100% { transform: scaleY(1); }
      48% { transform: scaleY(0.12); }
      50% { transform: scaleY(1); }
    }

    /* “볼” 살짝 움직임 */
    .cheek { transform-origin:center; }
    .cheek.anim { animation: cheek 3.8s ease-in-out infinite; }
    @keyframes cheek{
      0%,100%{ transform: translateY(0px); opacity:.95; }
      50%{ transform: translateY(1px); opacity:1; }
    }
  </style>
</head>
<body>
